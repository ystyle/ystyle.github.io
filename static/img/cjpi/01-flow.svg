<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720"><defs><marker id="ar-1d4ed8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/></marker><marker id="ar-6b5ce7" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b5ce7"/></marker><marker id="ar-d6dae3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d6dae3"/></marker></defs><rect width="1000" height="720" fill="#FBFBFD"/><text x="44" y="48" font-family="Noto Sans CJK SC, sans-serif" font-size="22" fill="#1F2430" font-weight="700" text-anchor="start">一个索引站的骨架</text><text x="44" y="74" font-family="Noto Sans CJK SC, sans-serif" font-size="13" fill="#6B7280" font-weight="400" text-anchor="start">数据只有一个来源，出口有五个：三个榜、一份月报、一组 MCP 工具</text><text x="44" y="112" font-family="Noto Sans CJK SC, sans-serif" font-size="13" fill="#6B7280" font-weight="600" text-anchor="start">① 数据从哪来</text><rect x="44" y="126" width="252" height="150" rx="12" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.6"/><text x="62" y="154" font-family="Noto Sans CJK SC, sans-serif" font-size="15" fill="#1D4ED8" font-weight="700" text-anchor="start">仓颉中心仓</text><text x="62" y="176" font-family="Noto Sans Mono CJK SC, monospace" font-size="12.5" fill="#6B7280" font-weight="400" text-anchor="start">pkg.cangjie-lang.cn</text><text x="62" y="204" font-family="Noto Sans CJK SC, sans-serif" font-size="12.5" fill="#1F2430" font-weight="400" text-anchor="start">搜索接口没有「全部包」</text><text x="62" y="224" font-family="Noto Sans CJK SC, sans-serif" font-size="12.5" fill="#1F2430" font-weight="400" text-anchor="start">包信息 / 版本 / 依赖</text><text x="62" y="244" font-family="Noto Sans CJK SC, sans-serif" font-size="12.5" fill="#6B7280" font-weight="400" text-anchor="start">Star 要去代码托管平台捞</text><text x="62" y="266" font-family="Noto Sans CJK SC, sans-serif" font-size="12.5" fill="#15803D" font-weight="400" text-anchor="start">全部公开元数据</text><text x="324" y="112" font-family="Noto Sans CJK SC, sans-serif" font-size="13" fill="#6B7280" font-weight="600" text-anchor="start">② 怎么拿全</text><rect x="324" y="126" width="300" height="150" rx="12" fill="#F1EFFE" stroke="#6B5CE7" stroke-width="1.6"/><text x="342" y="154" font-family="Noto Sans CJK SC, sans-serif" font-size="15" fill="#6B5CE7" font-weight="700" text-anchor="start">两种枚举拼起来</text><text x="342" y="180" font-family="Noto Sans Mono CJK SC, monospace" font-size="12.5" fill="#3B3560" font-weight="400" text-anchor="start">a→z 前缀各搜一遍</text><text x="342" y="200" font-family="Noto Sans CJK SC, sans-serif" font-size="12.5" fill="#1F2430" font-weight="400" text-anchor="start">再按下载/近期/更新/发布</text><text x="342" y="220" font-family="Noto Sans CJK SC, sans-serif" font-size="12.5" fill="#1F2430" font-weight="400" text-anchor="start">四种排序各翻 50 页</text><text x="342" y="248" font-family="Noto Sans CJK SC, sans-serif" font-size="12.5" fill="#6B7280" font-weight="400" text-anchor="start">单次翻开 10 页量级</text><text x="342" y="268" font-family="Noto Sans CJK SC, sans-serif" font-size="12.5" fill="#6B7280" font-weight="400" text-anchor="start">对不上就靠第二种排序兜</text><text x="652" y="112" font-family="Noto Sans CJK SC, sans-serif" font-size="13" fill="#6B7280" font-weight="600" text-anchor="start">③ 存哪</text><rect x="652" y="126" width="304" height="150" rx="12" fill="#FFFFFF" stroke="#D6DAE3" stroke-width="1.4"/><text x="670" y="154" font-family="Noto Sans CJK SC, sans-serif" font-size="15" fill="#1F2430" font-weight="700" text-anchor="start">SQLite，一个文件</text><text x="670" y="180" font-family="Noto Sans CJK SC, sans-serif" font-size="12.5" fill="#1F2430" font-weight="400" text-anchor="start">包 · 版本 · 依赖边</text><text x="670" y="200" font-family="Noto Sans CJK SC, sans-serif" font-size="12.5" fill="#1F2430" font-weight="400" text-anchor="start">分类 · Star · 发布人</text><text x="670" y="220" font-family="Noto Sans CJK SC, sans-serif" font-size="12.5" fill="#1F2430" font-weight="400" text-anchor="start">同步快照 · 访客</text><text x="670" y="248" font-family="Noto Sans CJK SC, sans-serif" font-size="12.5" fill="#6B7280" font-weight="400" text-anchor="start">每周日 03:00 跑一次全量</text><text x="670" y="268" font-family="Noto Sans CJK SC, sans-serif" font-size="12.5" fill="#6B7280" font-weight="400" text-anchor="start">每天 02:00 增量补齐</text><line x1="296" y1="201" x2="322" y2="201" stroke="#1D4ED8" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar-1d4ed8)"/><line x1="624" y1="201" x2="650" y2="201" stroke="#6B5CE7" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar-6b5ce7)"/><text x="44" y="320" font-family="Noto Sans CJK SC, sans-serif" font-size="13" fill="#6B7280" font-weight="600" text-anchor="start">④ 出口：同一个库，五种看法</text><line x1="500" y1="278" x2="500" y2="336" stroke="#D6DAE3" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar-d6dae3)"/><rect x="44" y="340" width="296" height="88" rx="10" fill="#FEF6E7" stroke="#B45309" stroke-width="1.4"/><text x="60" y="366" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#B45309" font-weight="700" text-anchor="start">排行榜</text><text x="60" y="388" font-family="Noto Sans CJK SC, sans-serif" font-size="12.5" fill="#1F2430" font-weight="400" text-anchor="start">谁在被依赖</text><text x="60" y="408" font-family="Noto Sans CJK SC, sans-serif" font-size="12.5" fill="#6B7280" font-weight="400" text-anchor="start">综合质量，名次可对比上周/上月</text><rect x="356" y="340" width="296" height="88" rx="10" fill="#EAF7EF" stroke="#15803D" stroke-width="1.4"/><text x="372" y="366" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#15803D" font-weight="700" text-anchor="start">活跃榜</text><text x="372" y="388" font-family="Noto Sans CJK SC, sans-serif" font-size="12.5" fill="#1F2430" font-weight="400" text-anchor="start">谁还在发版</text><text x="372" y="408" font-family="Noto Sans CJK SC, sans-serif" font-size="12.5" fill="#6B7280" font-weight="400" text-anchor="start">停更的包随时间自然衰减</text><rect x="668" y="340" width="296" height="88" rx="10" fill="#F1EFFE" stroke="#6B5CE7" stroke-width="1.4"/><text x="684" y="366" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#6B5CE7" font-weight="700" text-anchor="start">名人榜</text><text x="684" y="388" font-family="Noto Sans CJK SC, sans-serif" font-size="12.5" fill="#1F2430" font-weight="400" text-anchor="start">谁在养生态</text><text x="684" y="408" font-family="Noto Sans CJK SC, sans-serif" font-size="12.5" fill="#6B7280" font-weight="400" text-anchor="start">以发布人为维度，看广度与活跃</text><rect x="44" y="444" width="296" height="88" rx="10" fill="#EEF2FF" stroke="#1D4ED8" stroke-width="1.4"/><text x="60" y="470" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#1D4ED8" font-weight="700" text-anchor="start">月报</text><text x="60" y="492" font-family="Noto Sans CJK SC, sans-serif" font-size="12.5" fill="#1F2430" font-weight="400" text-anchor="start">这个月变了什么</text><text x="60" y="512" font-family="Noto Sans CJK SC, sans-serif" font-size="12.5" fill="#6B7280" font-weight="400" text-anchor="start">数字程序算，点评 AI 写并校验</text><rect x="356" y="444" width="296" height="88" rx="10" fill="#F3F4F7" stroke="#475569" stroke-width="1.4"/><text x="372" y="470" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#475569" font-weight="700" text-anchor="start">MCP</text><text x="372" y="492" font-family="Noto Sans CJK SC, sans-serif" font-size="12.5" fill="#1F2430" font-weight="400" text-anchor="start">让 agent 自己查</text><text x="372" y="512" font-family="Noto Sans CJK SC, sans-serif" font-size="12.5" fill="#6B7280" font-weight="400" text-anchor="start">五个工具，在线/离线两种接法</text><rect x="44" y="568" width="912" height="108" rx="12" fill="#FFFFFF" stroke="#B45309" stroke-width="1.4"/><text x="64" y="596" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#B45309" font-weight="700" text-anchor="start">为什么值得单独做一个站</text><text x="64" y="622" font-family="Noto Sans CJK SC, sans-serif" font-size="12.5" fill="#1F2430" font-weight="400" text-anchor="start">中心仓给的是「能不能找到这个包」，索引回答的是「这个包有多少人在用、还在不在维护、谁在背后」。</text><text x="64" y="646" font-family="Noto Sans CJK SC, sans-serif" font-size="12.5" fill="#6B7280" font-weight="400" text-anchor="start">两种问题不一样，一个搜索框装不下第二个。数据全部来自公开元数据，别人爬同样的接口能复现同样的榜。</text></svg>